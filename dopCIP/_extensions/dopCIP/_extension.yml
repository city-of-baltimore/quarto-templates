title: dopCIP
author: Eli Pousson
version: 1.2.0
quarto-required: ">=1.7.0"
contributes:
  formats:
    typst:
      author:
      -  'Baltimore City Department of Planning'
      template-partials:
        - typst-template.typ
        - typst-show.typ
      format-resources:
        - baltimore-city-dop-logo.png
